[project]
name = "discordbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "fastapi>=0.135.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.44.0",
]

[project.scripts]
discordbot = "discordbot.main:run_discord_bot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
