<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Bot Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Discord Bot Control</h1>

  <!-- Current channel banner -->
  <section id="channel-status">
    <span id="channel-label">Channel: <strong id="channel-display">—</strong></span>
    <button id="refresh-channel">Refresh</button>
  </section>

  <div class="panels">

    <!-- Change channel -->
    <section class="panel">
      <h2>Change Channel</h2>
      <form id="form-cd">
        <input type="number" name="channel_id" placeholder="Channel ID" required />
        <button type="submit">Switch</button>
      </form>
    </section>

    <!-- Send message -->
    <section class="panel">
      <h2>Send Message</h2>
      <form id="form-message">
        <textarea name="message" placeholder="Message…" rows="3" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <!-- Ping -->
    <section class="panel">
      <h2>Ping User</h2>
      <form id="form-ping">
        <input type="number" name="user_id" placeholder="User ID" required />
        <input type="number" name="count" placeholder="Count (default 1)" min="1" max="20" />
        <button type="submit">Ping</button>
      </form>
    </section>

    <!-- DM -->
    <section class="panel">
      <h2>Direct Message</h2>
      <form id="form-dm">
        <input type="number" name="user_id" placeholder="User ID" required />
        <textarea name="message" placeholder="Message…" rows="3" required></textarea>
        <button type="submit">Send DM</button>
      </form>
    </section>

    <!-- Reply -->
    <section class="panel">
      <h2>Reply to Message</h2>
      <form id="form-reply">
        <input type="number" name="message_id" placeholder="Message ID" required />
        <textarea name="content" placeholder="Reply…" rows="3" required></textarea>
        <button type="submit">Reply</button>
      </form>
    </section>

  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
